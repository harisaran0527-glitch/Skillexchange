version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - NODE_ENV=production
    # In production do not mount source — use built image
    # volumes: [ 
    #   .:/usr/src/app
    # ]
    command: node server.js
    restart: unless-stopped
    depends_on: []
